  .article-card{

<script>
/* ================= 基础工具 ================= */
const ADMIN_PASSWORD = 'admin123';
function isAdmin(){ return sessionStorage.getItem('sxx_admin_auth') === '1'; }
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), ms || 2600);
}
function adminLogin(){
  if(isAdmin()){ document.body.classList.add('admin-mode'); setEditable(true); toast('管理员模式已开启'); return; }
  const pwd = prompt('请输入管理员密码：');
  if(pwd === null) return;
  if(pwd === ADMIN_PASSWORD){
    sessionStorage.setItem('sxx_admin_auth','1');
    document.body.classList.add('admin-mode'); setEditable(true);
    toast('✅ 管理员模式已开启，点击标题/正文可直接编辑');
  } else if(pwd !== ''){
    alert('密码错误');
  }
}

/* ================= IndexedDB（与首页同库，媒体/元数据共享） ================= */
const DB_NAME = 'sxx_database', DB_VERSION = 2;
let db = null;
function openDB(){
  return new Promise((resolve, reject) => {
    if(db) return resolve(db);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      if(!_db.objectStoreNames.contains('images')) _db.createObjectStore('images', { keyPath:'key' });
      if(!_db.objectStoreNames.contains('metadata')) _db.createObjectStore('metadata', { keyPath:'key' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}
function getMetaFromDB(key){
  return openDB().then(_db => new Promise((resolve, reject) => {
    const tx = _db.transaction('metadata','readonly');
    const rq = tx.objectStore('metadata').get(key);
    rq.onsuccess = () => resolve(rq.result ? rq.result.value : null);
    rq.onerror = (e) => reject(e.target.error);
  }));
}
function saveMetaToDB(key, value){
  return openDB().then(_db => new Promise((resolve, reject) => {
    const tx = _db.transaction('metadata','readwrite');
    tx.objectStore('metadata').put({ key, value });
    tx.onsuccess = () => resolve(true);
    tx.onerror = (e) => reject(e.target.error);
  }));
}
function getImgRecord(key){
  return openDB().then(_db => new Promise((resolve, reject) => {
    const tx = _db.transaction('images','readonly');
    const rq = tx.objectStore('images').get(key);
    rq.onsuccess = () => resolve(rq.result || null);
    rq.onerror = (e) => reject(e.target.error);
  }));
}
function putImgRecord(key, blob){
  return openDB().then(_db => new Promise((resolve, reject) => {
    const tx = _db.transaction('images','readwrite');
    tx.objectStore('images').put({ key, data: blob, ts: Date.now() });
    tx.onsuccess = () => resolve(true);
    tx.onerror = (e) => reject(e.target.error);
  }));
}
function delImgRecord(key){
  return openDB().then(_db => new Promise((resolve, reject) => {
    const tx = _db.transaction('images','readwrite');
    tx.objectStore('images').delete(key);
    tx.onsuccess = () => resolve(true);
    tx.onerror = (e) => reject(e.target.error);
  }));
}

/* ================= 云端元数据（拉取 + 文化字段安全推送） ================= */
function ghCfg(){ try{ return JSON.parse(localStorage.getItem('sxx_github_config') || 'null'); }catch(e){ return null; } }
// 通道1 GitHub Pages（免限流），通道2 API raw 兜底
async function fetchCloudMeta(){
  const cfg = ghCfg();
  if(!cfg || !cfg.repo) return null;
  try{
    const slash = cfg.repo.indexOf('/');
    const owner = cfg.repo.slice(0, slash), repo = cfg.repo.slice(slash + 1);
    const r = await fetch('https://' + owner + '.github.io/' + repo + '/sxx_metadata.json?buster=' + Date.now(), { cache:'no-store' });
    if(r.ok){
      const j = await r.json();
      if(j && typeof j === 'object' && !Array.isArray(j)) return j;
    }
  }catch(e){}
  try{
    const h = { 'Accept':'application/vnd.github.raw' };
    if(cfg.token) h['Authorization'] = 'token ' + cfg.token;
    const r2 = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json?raw=' + Date.now(), { headers:h, cache:'no-store' });
    if(r2.ok){
      const j = JSON.parse(await r2.text());
      if(j && typeof j === 'object' && !Array.isArray(j)) return j;
    }
  }catch(e){}
  return null;
}
// 推送：拉云端最新为底，只改文化马踏相关字段（culture_intro / culture_title / cultureKeys / culture_* 媒体登记），防覆盖其他板块
async function pushCultureMeta(patch){
  const cfg = ghCfg();
  if(!cfg || !cfg.token){ throw new Error('未配置 GitHub Token，改动仅保存在本机'); }
  const cloud = await fetchCloudMeta().catch(() => null) || {};
  if(patch.text !== undefined){
    cloud.textData = Object.assign({}, cloud.textData || {}, { culture_intro: patch.text });
  }
  if(patch.title !== undefined){
    cloud.textData = Object.assign({}, cloud.textData || {}, { culture_title: patch.title });
  }
  if(patch.subtitle !== undefined){
    cloud.textData = Object.assign({}, cloud.textData || {}, { culture_subtitle: patch.subtitle });
  }
  if(patch.keys !== undefined) cloud.cultureKeys = patch.keys;
  if(patch.media !== undefined){
    cloud.mediaFiles = Object.assign({}, cloud.mediaFiles || {}, patch.media);
  }
  cloud.timestamp = Date.now();
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(cloud))));
  const H = { 'Authorization':'token ' + cfg.token, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' };
  const doPut = async (sha) => {
    const body = { message:'sync culture page', content:b64 };
    if(sha) body.sha = sha;
    const r = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { method:'PUT', headers:H, body:JSON.stringify(body) });
    if(!r.ok && (r.status === 409 || r.status === 422)){
      const g = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { headers:H });
      if(g.ok){
        const j = await g.json();
        const body2 = { message:'sync culture page retry', content:b64, sha:j.sha };
        const r2 = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { method:'PUT', headers:H, body:JSON.stringify(body2) });
        if(!r2.ok) throw new Error('上传失败 ' + r2.status);
        return;
      }
    }
    if(!r.ok) throw new Error('上传失败 ' + r.status);
  };
  let sha = null;
  try{
    const g = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { headers:{ 'Authorization':'token ' + cfg.token, 'Accept':'application/vnd.github.v3+json' } });
    if(g.ok) sha = (await g.json()).sha;
  }catch(e){}
  await doPut(sha);
}

/* ================= 媒体上传（大图自动走 Git Database 通道） ================= */
let _ghBranchCache = null;
async function ghGitDefaultBranch(cfg){
  if(_ghBranchCache) return _ghBranchCache;
  const r = await fetch('https://api.github.com/repos/' + cfg.repo, { headers:{ 'Authorization':'token ' + cfg.token, 'Accept':'application/vnd.github.v3+json' } });
  if(!r.ok) throw new Error('获取仓库信息失败 ' + r.status);
  _ghBranchCache = (await r.json()).default_branch || 'main';
  return _ghBranchCache;
}
async function uploadGitDB(path, b64, cfg){
  const H = { 'Authorization':'token ' + cfg.token, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' };
  const branch = await ghGitDefaultBranch(cfg);
  const refR = await fetch('https://api.github.com/repos/' + cfg.repo + '/git/ref/heads/' + branch, { headers:H });
  if(!refR.ok) throw new Error('读取分支失败 ' + refR.status);
  const commitSha = (await refR.json()).object.sha;
  const cmR = await fetch('https://api.github.com/repos/' + cfg.repo + '/git/commits/' + commitSha, { headers:H });
  if(!cmR.ok) throw new Error('读取提交失败 ' + cmR.status);
  const treeSha = (await cmR.json()).tree.sha;
  const blobR = await fetch('https://api.github.com/repos/' + cfg.repo + '/git/blobs', { method:'POST', headers:H, body:JSON.stringify({ content:b64, encoding:'base64' }) });
  if(!blobR.ok) throw new Error('上传文件块失败 ' + blobR.status);
  const blobSha = (await blobR.json()).sha;
  const treeR = await fetch('https://api.github.com/repos/' + cfg.repo + '/git/trees', { method:'POST', headers:H, body:JSON.stringify({ base_tree:treeSha, tree:[{ path, mode:'100644', type:'blob', sha:blobSha }] }) });
  if(!treeR.ok) throw new Error('创建目录树失败 ' + treeR.status);
  const newTreeSha = (await treeR.json()).sha;
  const ncR = await fetch('https://api.github.com/repos/' + cfg.repo + '/git/commits', { method:'POST', headers:H, body:JSON.stringify({ message:'Upload ' + path + ' via culture page', tree:newTreeSha, parents:[commitSha] }) });
  if(!ncR.ok) throw new Error('创建提交失败 ' + ncR.status);
  const newCommitSha = (await ncR.json()).sha;
  const upR = await fetch('https://api.github.com/repos/' + cfg.repo + '/git/refs/heads/' + branch, { method:'PATCH', headers:H, body:JSON.stringify({ sha:newCommitSha, force:false }) });
  if(!upR.ok) throw new Error('更新分支失败 ' + upR.status);
}
async function uploadMedia(path, b64){
  const cfg = ghCfg();
  if(!cfg || !cfg.token) throw new Error('未配置 GitHub Token');
  if(b64.length > 900000){ return uploadGitDB(path, b64, cfg); } // 大图走 Git DB（Contents 硬限 1MB）
  const H = { 'Authorization':'token ' + cfg.token, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' };
  const doPut = async (sha) => {
    const body = { message:'Upload ' + path + ' via culture page', content:b64 };
    if(sha) body.sha = sha;
    const r = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/' + path, { method:'PUT', headers:H, body:JSON.stringify(body) });
    if(!r.ok && (r.status === 409 || r.status === 422)){
      const g = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/' + path, { headers:H });
      if(g.ok){ const j = await g.json(); return doPut(j.sha); }
    }
    if(!r.ok) throw new Error('上传失败 ' + r.status);
  };
  let sha = null;
  try{
    const g = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/' + path, { headers:{ 'Authorization':'token ' + cfg.token, 'Accept':'application/vnd.github.v3+json' } });
    if(g.ok) sha = (await g.json()).sha;
  }catch(e){}
  await doPut(sha);
}
// 压缩：>300KB 或 >1920px 压到 1600px/0.82，仍超 900KB 逐档降
function compressImageFile(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objURL = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const need = file.size > 300 * 1024 || w > 1920 || h > 1920;
      if(!need){ URL.revokeObjectURL(objURL); resolve(file); return; }
      const scale = Math.min(1, 1600 / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const steps = [[1600,.82],[1400,.7],[1200,.6],[1000,.5]];
      let last = null;
      const tryStep = (i) => {
        if(i >= steps.length){ URL.revokeObjectURL(objURL); resolve(last); return; }
        const cw = Math.min(w, steps[i][0]), ch = Math.round(h * (cw / w));
        const cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
        cv.toBlob(b => {
          if(b && b.size <= 900 * 1024){ URL.revokeObjectURL(objURL); resolve(b); return; }
          last = b; tryStep(i + 1);
        }, 'image/jpeg', steps[i][1]);
      };
      tryStep(0);
    };
    img.onerror = () => { URL.revokeObjectURL(objURL); reject(new Error('图片读取失败')); };
    img.src = objURL;
  });
}

/* ================= 页面渲染 ================= */
const DEFAULT_INTRO = '马踏镇，隶属广东省茂名市电白区，地处电白东部、马踏河畔，是一座有着数百年历史的岭南古墟。\n\n这里红色文化底蕴深厚，杨瑞芬故居等革命遗址诉说着峥嵘岁月；这里乡韵悠长，千年古窑、古荔园与青山绿水交相辉映。近年来，马踏镇以"百千万工程"为引擎，推动农文旅深度融合，让古老墟镇焕发新的生机。\n\n走进马踏，品味岭南乡韵，感受文化传承的温度。';
const DEFAULT_TITLE = '文化马踏';
const DEFAULT_SUBTITLE = '—— 马踏镇简介 · 新闻推文 ——';
let _cultureKeys = [];   // 配图 id 列表（字符串，升序展示）

function blobToDataURL(blob){
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => resolve('');
    fr.readAsDataURL(blob);
  });
}
// 单图加载：本地 IndexedDB → 云端 Pages 文件 → API raw 兜底
async function loadCultureImage(id){
  const storeKey = 'culture_' + id;
  try{
    const rec = await getImgRecord(storeKey);
    if(rec && rec.data){
      const url = rec.data instanceof Blob ? URL.createObjectURL(rec.data) : String(rec.data);
      if(url) return url;
    }
  }catch(e){}
  const cfg = ghCfg();
  if(cfg && cfg.repo){
    const slash = cfg.repo.indexOf('/');
    const owner = cfg.repo.slice(0, slash), repo = cfg.repo.slice(slash + 1);
    try{
      const r = await fetch('https://' + owner + '.github.io/' + repo + '/media/' + storeKey + '.img?buster=' + Date.now(), { cache:'no-store' });
      if(r.ok){
        const blob = await r.blob();
        putImgRecord(storeKey, blob).catch(() => {});
        return URL.createObjectURL(blob);
      }
    }catch(e){}
    try{
      const h = { 'Accept':'application/vnd.github.raw' };
      if(cfg.token) h['Authorization'] = 'token ' + cfg.token;
      const r2 = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/media/' + storeKey + '.img?raw=' + Date.now(), { headers:h, cache:'no-store' });
      if(r2.ok){
        const blob = await r2.blob();
        putImgRecord(storeKey, blob).catch(() => {});
        return URL.createObjectURL(blob);
      }
    }catch(e){}
  }
  return '';
}
function renderPhotos(){
  const grid = document.getElementById('phGrid');
  if(!_cultureKeys.length){
    grid.innerHTML = '<div class="ph-empty">暂无配图' + (isAdmin() ? '，点击「＋ 添加配图」上传' : '') + '</div>';
    return;
  }
  grid.innerHTML = _cultureKeys.map(id =>
    '<div class="ph-item" data-pid="' + escapeHtml(id) + '">' +
      '<img alt="文化马踏配图" data-pimg="' + escapeHtml(id) + '">' +
      '<button class="ph-del" onclick="delPhoto(\'' + escapeHtml(id) + '\')" title="删除配图">✕</button>' +
    '</div>'
  ).join('') + '<div class="ph-add" onclick="document.getElementById(\'phFile\').click()"><div class="plus">＋</div>添加配图</div>';
  _cultureKeys.forEach(async (id) => {
    const url = await loadCultureImage(id);
    const img = grid.querySelector('[data-pimg="' + id + '"]');
    if(img){ if(url){ img.src = url; } else { img.style.opacity = .15; } }
  });
}
function renderText(text){
  const el = document.getElementById('artBody');
  el.textContent = (text && text.trim()) ? text : (isAdmin() ? '点击这里输入马踏文化介绍推文、新闻稿内容……' : DEFAULT_INTRO);
  el.classList.toggle('empty-hint', !(text && text.trim()));
  el.contentEditable = isAdmin() ? 'true' : 'false';
}
function renderHeading(title, subtitle){
  const h = document.getElementById('artHeading'), s = document.getElementById('artSub');
  h.textContent = (title && title.trim()) ? title : DEFAULT_TITLE;
  s.textContent = (subtitle && subtitle.trim()) ? subtitle : DEFAULT_SUBTITLE;
  h.contentEditable = isAdmin() ? 'true' : 'false';
  s.contentEditable = isAdmin() ? 'true' : 'false';
}

/* ================= 初始化 ================= */
async function init(){
  try{
    // 1) 本地缓存优先渲染
    let meta = null;
    try{ meta = (await getMetaFromDB('allMetadata')) || null; }catch(e){}
    if(meta){
      _cultureKeys = Array.isArray(meta.cultureKeys) ? meta.cultureKeys.slice() : [];
      renderHeading((meta.textData || {}).culture_title, (meta.textData || {}).culture_subtitle);
      renderText((meta.textData || {}).culture_intro);
      renderPhotos();
    }
    // 2) 云端拉取校正
    const cloud = await fetchCloudMeta();
    if(cloud){
      const cloudKeys = Array.isArray(cloud.cultureKeys) ? cloud.cultureKeys : [];
      const cloudText = (cloud.textData || {}).culture_intro || '';
      const cloudTitle = (cloud.textData || {}).culture_title || '';
      const cloudSub = (cloud.textData || {}).culture_subtitle || '';
      const localText = (meta && meta.textData || {}).culture_intro || '';
      if(cloudKeys.join(',') !== _cultureKeys.join(',') || cloudText !== localText || !meta){
        _cultureKeys = cloudKeys;
        renderHeading(cloudTitle, cloudSub);
        renderText(cloudText);
        renderPhotos();
        try{
          const dbMeta = (await getMetaFromDB('allMetadata')) || {};
          dbMeta.cultureKeys = cloudKeys;
          dbMeta.textData = Object.assign({}, dbMeta.textData || {}, { culture_intro: cloudText, culture_title: cloudTitle, culture_subtitle: cloudSub });
          await saveMetaToDB('allMetadata', dbMeta);
        }catch(e){}
      }
    }
  }catch(e){ console.warn('init:', e); }
  document.getElementById('loading').classList.add('hide');
  if(isAdmin()){ document.body.classList.add('admin-mode'); setEditable(true); }
}

/* ================= 管理员编辑 ================= */
function setEditable(on){
  ['artBody','artHeading','artSub'].forEach(id => {
    document.getElementById(id).contentEditable = on ? 'true' : 'false';
  });
  const body = document.getElementById('artBody');
  body.classList.toggle('empty-hint', on && !body.textContent.trim());
  if(on && !body.textContent.trim()) body.textContent = '点击这里输入马踏文化介绍推文、新闻稿内容……';
  if(!on && !body.textContent.trim()) body.textContent = '本栏目暂无介绍内容，等待管理员补充。';
}
// 标题/小标题失焦保存
document.getElementById('artHeading').addEventListener('blur', async function(){
  if(!isAdmin()) return;
  const title = this.innerText.replace(/\u00a0/g, ' ').trim();
  if(!title){ this.textContent = DEFAULT_TITLE; toast('标题不能为空，已恢复默认'); return; }
  try{
    const meta = (await getMetaFromDB('allMetadata')) || {};
    meta.textData = Object.assign({}, meta.textData || {}, { culture_title: title });
    await saveMetaToDB('allMetadata', meta);
  }catch(e){}
  try{ await pushCultureMeta({ title }); toast('✅ 标题已保存并同步云端'); }
  catch(e){ toast('⚠️ 已保存本机：' + e.message); }
});
document.getElementById('artSub').addEventListener('blur', async function(){
  if(!isAdmin()) return;
  const sub = this.innerText.replace(/\u00a0/g, ' ').trim();
  if(!sub){ this.textContent = DEFAULT_SUBTITLE; toast('小标题不能为空，已恢复默认'); return; }
  try{
    const meta = (await getMetaFromDB('allMetadata')) || {};
    meta.textData = Object.assign({}, meta.textData || {}, { culture_subtitle: sub });
    await saveMetaToDB('allMetadata', meta);
  }catch(e){}
  try{ await pushCultureMeta({ subtitle: sub }); toast('✅ 小标题已保存并同步云端'); }
  catch(e){ toast('⚠️ 已保存本机：' + e.message); }
});
// 正文失焦保存（innerText 保留换行）
document.getElementById('artBody').addEventListener('blur', async function(){
  if(!isAdmin()) return;
  const text = this.innerText.replace(/\u00a0/g, ' ').trim();
  if(!text){ toast('内容为空，未保存'); return; }
  try{
    const meta = (await getMetaFromDB('allMetadata')) || {};
    meta.textData = Object.assign({}, meta.textData || {}, { culture_intro: text });
    await saveMetaToDB('allMetadata', meta);
  }catch(e){}
  try{
    await pushCultureMeta({ text });
    toast('✅ 介绍内容已保存并同步云端');
  }catch(e){ toast('⚠️ 已保存本机：' + e.message); }
});
// 添加配图
document.getElementById('phFile').addEventListener('change', async function(){
  const file = this.files && this.files[0];
  this.value = '';
  if(!file || !isAdmin()) return;
  toast('正在上传配图…', 8000);
  try{
    const blob = await compressImageFile(file);
    const b64 = await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = () => reject(new Error('读取失败'));
      fr.readAsDataURL(blob);
    });
    const maxId = _cultureKeys.reduce((m, id) => Math.max(m, parseInt(id) || 0), 0);
    const newId = String(maxId + 1);
    await uploadMedia('media/culture_' + newId + '.img', b64);
    await putImgRecord('culture_' + newId, blob);
    const keys = _cultureKeys.concat([newId]);
    await pushCultureMeta({ keys, media: { ['culture_' + newId]: 'img' } });
    _cultureKeys = keys;
    renderPhotos();
    try{
      const meta = (await getMetaFromDB('allMetadata')) || {};
      meta.cultureKeys = keys;
      meta.mediaFiles = Object.assign({}, meta.mediaFiles || {}, { ['culture_' + newId]: 'img' });
      await saveMetaToDB('allMetadata', meta);
    }catch(e){}
    toast('✅ 配图已上传并同步云端');
  }catch(e){ toast('⚠️ 上传失败：' + e.message, 4200); }
});
// 删除配图
async function delPhoto(id){
  if(!isAdmin()) return;
  if(!confirm('确定删除这张配图吗？（自动同步云端）')) return;
  _cultureKeys = _cultureKeys.filter(k => k !== id);
  renderPhotos();
  delImgRecord('culture_' + id).catch(() => {});
  try{
    const meta = (await getMetaFromDB('allMetadata')) || {};
    meta.cultureKeys = _cultureKeys;
    if(meta.mediaFiles) delete meta.mediaFiles['culture_' + id];
    await saveMetaToDB('allMetadata', meta);
  }catch(e){}
  try{
    // media 传空对象意义不大，这里把 cultureKeys 变更推上去即可（媒体文件保留在仓库，不再展示）
    await pushCultureMeta({ keys: _cultureKeys });
    toast('✅ 配图已删除并同步云端');
  }catch(e){ toast('⚠️ 已删除本机：' + e.message); }
}

init();
</script>
