<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 · 个人中心 | 三下乡文化云游</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:#F5E6D3;
    background-image:radial-gradient(circle at 20% 20%, rgba(139,26,26,.04) 0%, transparent 50%),radial-gradient(circle at 80% 80%, rgba(139,26,26,.04) 0%, transparent 50%);
    color:#4a2c2c;min-height:100vh;padding-bottom:64px;
  }
  .top-nav{
    position:sticky;top:0;z-index:100;
    background:#8B1A1A;color:#fff;
    padding:10px 18px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .top-nav .logo{color:#FDE68A;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:2px;display:flex;align-items:center;gap:8px}
  .back-home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:20px;transition:.25s;letter-spacing:1px}
  .back-home:hover{background:rgba(255,255,255,.28)}

  .page-main{max-width:760px;margin:0 auto;padding:22px 16px 50px}

  /* 用户卡片 */
  .user-card{
    background:linear-gradient(135deg,#8B1A1A,#a63426);color:#fff;border-radius:18px;
    padding:26px 24px;display:flex;align-items:center;gap:18px;
    box-shadow:0 8px 24px rgba(139,26,26,.3);margin-bottom:22px;position:relative;overflow:hidden;
  }
  .user-card::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
  .avatar{
    width:64px;height:64px;border-radius:50%;background:#FDE68A;color:#8B1A1A;
    display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;
    border:3px solid rgba(255,255,255,.5);
  }
  .user-info .u-name{font-size:19px;font-weight:700;letter-spacing:2px;margin-bottom:5px}
  .user-info .u-desc{font-size:12.5px;opacity:.85;letter-spacing:1px}
  .admin-badge{
    margin-left:auto;background:#FDE68A;color:#8B1A1A;font-size:12px;font-weight:700;
    padding:5px 14px;border-radius:16px;letter-spacing:1px;display:none;
  }
  body.admin-mode .admin-badge{display:block}

  /* 数据统计 */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat-card{
    background:#fff;border-radius:14px;border:1px solid #f0dcc4;text-align:center;
    padding:16px 8px;box-shadow:0 3px 12px rgba(139,26,26,.08);
  }
  .stat-card .st-num{font-size:24px;font-weight:700;color:#8B1A1A}
  .stat-card .st-label{font-size:11.5px;color:#a0764f;margin-top:4px;letter-spacing:1px}

  /* 功能列表 */
  .func-list{background:#fff;border-radius:16px;border:1px solid #f0dcc4;overflow:hidden;box-shadow:0 3px 12px rgba(139,26,26,.08);margin-bottom:22px}
  .func-item{
    display:flex;align-items:center;gap:14px;padding:16px 20px;
    border-bottom:1px solid #f6ead8;cursor:pointer;transition:background .2s;
    text-decoration:none;color:#4a2c2c;
  }
  .func-item:last-child{border-bottom:none}
  .func-item:hover{background:#FFF9F0}
  .func-item .fi-icon{width:40px;height:40px;border-radius:12px;background:#F5E6D3;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .func-item .fi-body{flex:1}
  .func-item .fi-title{font-size:15px;font-weight:700;color:#5a3a3a;letter-spacing:1px}
  .func-item .fi-sub{font-size:12px;color:#a08a76;margin-top:3px}
  .func-item .fi-arrow{color:#d4b896;font-size:16px}
  .admin-only{display:none}
  body.admin-mode .admin-only{display:flex}
  body.admin-mode .guest-only{display:none}

  /* 反馈表单 */
  .fb-card{background:#fff;border-radius:16px;border:1px solid #f0dcc4;padding:20px 22px;box-shadow:0 3px 12px rgba(139,26,26,.08);margin-bottom:22px}
  .fb-card h3{color:#8B1A1A;font-size:16px;letter-spacing:2px;margin-bottom:14px}
  .fb-card input,.fb-card textarea{
    width:100%;border:1.5px solid #e8d3b0;border-radius:10px;padding:11px 14px;
    font-size:13.5px;font-family:inherit;color:#4a2c2c;margin-bottom:12px;outline:none;
    background:#FFFBF5;transition:border .2s;
  }
  .fb-card input:focus,.fb-card textarea:focus{border-color:#C9A24A}
  .fb-card textarea{height:90px;resize:vertical}
  .fb-submit{
    background:#8B1A1A;color:#FDE68A;border:none;border-radius:20px;
    padding:10px 30px;font-size:14px;letter-spacing:2px;cursor:pointer;display:block;margin:0 auto;transition:.2s;
  }
  .fb-submit:hover{background:#6E1414;transform:scale(1.03)}

  /* 反馈列表（管理员） */
  .fb-list{margin-top:16px}
  .fb-item{background:#FFFBF5;border:1px solid #f0e0cc;border-radius:12px;padding:12px 16px;margin-bottom:10px;position:relative}
  .fb-item .fb-name{font-size:13px;font-weight:700;color:#8B1A1A;margin-bottom:4px}
  .fb-item .fb-text{font-size:13px;color:#5a4a3a;line-height:1.7}
  .fb-item .fb-del{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;font-size:14px}

  /* 管理员登录弹窗 */
  .modal{position:fixed;inset:0;background:rgba(40,10,10,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.active{display:flex}
  .modal-box{background:#fff;border-radius:16px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
  .modal-header{background:#8B1A1A;color:#FDE68A;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
  .modal-header h3{font-size:16px;letter-spacing:2px}
  .modal-header button{background:none;border:none;color:#fff;font-size:17px;cursor:pointer}
  .modal-body{padding:22px 24px 26px}
  .modal-body input{
    width:100%;border:1.5px solid #e8d3b0;border-radius:10px;padding:11px 14px;
    font-size:14px;outline:none;margin-bottom:8px;background:#FFFBF5;
  }
  .modal-body input:focus{border-color:#C9A24A}
  .login-err{color:#c0392b;font-size:12.5px;margin-bottom:8px;display:none}
  .login-err.show{display:block}
  .login-btn{
    width:100%;background:#8B1A1A;color:#FDE68A;border:none;border-radius:10px;
    padding:11px 0;font-size:15px;letter-spacing:3px;cursor:pointer;margin-top:6px;
  }
  .login-btn:hover{background:#6E1414}

  .admin-tip{display:none;position:fixed;top:56px;right:14px;z-index:160;background:#C9A24A;color:#5a3a00;font-size:12px;padding:6px 14px;border-radius:20px;box-shadow:0 3px 10px rgba(0,0,0,.2);letter-spacing:1px}
  body.admin-mode .admin-tip{display:block}

  .bottom-tab{position:fixed;left:0;right:0;bottom:0;z-index:150;height:56px;background:#fff;border-top:2px solid #C9A24A;display:flex;box-shadow:0 -3px 14px rgba(139,26,26,.1)}
  .bottom-tab .bt-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#9a8f85;font-size:10.5px;letter-spacing:1px}
  .bottom-tab .bt-icon{font-size:20px;line-height:1}
  .bottom-tab .bt-item.active{color:#8B1A1A;font-weight:700}

  @media(max-width:640px){
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .page-main{padding:16px 12px 40px}
  }
</style>

<script>
/* ============ 数据层（与 index.html 同源共享 IndexedDB） ============ */
const ADMIN_PASSWORD = 'admin123';
const DB_NAME = 'sxx_database', DB_VERSION = 2;
let db = null, isAdmin = false;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('images')) d.createObjectStore('images', { keyPath:'key' });
      if(!d.objectStoreNames.contains('metadata')) d.createObjectStore('metadata', { keyPath:'key' });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}
function getMetaFromDB(key){
  return new Promise((resolve, reject) => {
    const tx = db.transaction('metadata','readonly'), rq = tx.objectStore('metadata').get(key);
    rq.onsuccess = () => resolve(rq.result ? rq.result.value : null);
    rq.onerror = (e) => reject(e.target.error);
  });
}

/* ============ 管理员登录 ============ */
function checkAdmin(){
  // 每次进入默认游客模式：登录状态仅保存在当前标签页（sessionStorage），并清除旧的持久化标记
  try{ localStorage.removeItem('sxx_admin_auth'); }catch(e){}
  if(sessionStorage.getItem('sxx_admin_auth') === '1'){
    isAdmin = true;
    document.body.classList.add('admin-mode');
  }
}
function openLogin(){
  document.getElementById('loginModal').classList.add('active');
  document.getElementById('loginErr').classList.remove('show');
  document.getElementById('adminPwd').value = '';
  setTimeout(() => document.getElementById('adminPwd').focus(), 100);
}
function closeLogin(){ document.getElementById('loginModal').classList.remove('active'); }
function doLogin(){
  const pwd = document.getElementById('adminPwd').value;
  if(pwd === ADMIN_PASSWORD){
    isAdmin = true;
    sessionStorage.setItem('sxx_admin_auth', '1');
    document.body.classList.add('admin-mode');
    closeLogin();
    alert('✅ 管理员登录成功！所有页面均可编辑内容（关闭页面后自动回到游客模式）');
  } else {
    document.getElementById('loginErr').classList.add('show');
  }
}
function logoutAdmin(){
  if(!confirm('确定退出管理员模式吗？')) return;
  isAdmin = false;
  sessionStorage.removeItem('sxx_admin_auth');
  document.body.classList.remove('admin-mode');
}

/* ============ 购物车管理 ============ */
function getCart(){ try{ return JSON.parse(localStorage.getItem('sxx_cart') || '[]'); }catch(e){ return []; } }
function updateCartInfo(){
  const n = getCart().reduce((s, c) => s + c.qty, 0);
  document.getElementById('cartInfo').textContent = n ? `购物车有 ${n} 件商品` : '商城选购暂存';
}
function clearCart(){
  const n = getCart().reduce((s, c) => s + c.qty, 0);
  if(!n){ alert('购物车已经是空的啦～'); return; }
  if(!confirm(`确定清空购物车中的 ${n} 件商品吗？`)) return;
  localStorage.removeItem('sxx_cart');
  updateCartInfo();
  alert('已清空购物车');
}

/* ============ 留言反馈（localStorage 持久，管理员可查看/删除） ============ */
function getFeedbacks(){ try{ return JSON.parse(localStorage.getItem('sxx_feedback') || '[]'); }catch(e){ return []; } }
function submitFeedback(){
  const name = document.getElementById('fbName').value.trim() || '匿名游客';
  const text = document.getElementById('fbText').value.trim();
  if(!text){ alert('请先填写留言内容～'); return; }
  const list = getFeedbacks();
  list.unshift({ name, text, time: new Date().toLocaleString('zh-CN') });
  localStorage.setItem('sxx_feedback', JSON.stringify(list));
  document.getElementById('fbText').value = '';
  alert('💌 留言提交成功！感谢您的支持');
  renderFeedbacks();
}
function renderFeedbacks(){
  if(!isAdmin) return;
  const list = getFeedbacks();
  const box = document.getElementById('fbList');
  box.style.display = 'block';
  box.innerHTML = '<h3 style="color:#8B1A1A;font-size:14px;letter-spacing:2px;margin-bottom:10px">📥 收到的留言（仅管理员可见）</h3>' +
    (list.length ? list.map((f, i) => `
      <div class="fb-item">
        <div class="fb-name">${f.name} · ${f.time}</div>
        <div class="fb-text">${f.text}</div>
        <button class="fb-del" onclick="delFeedback(${i})" title="删除">🗑️</button>
      </div>
    `).join('') : '<div style="color:#b89878;font-size:13px;text-align:center;padding:10px 0">暂无留言</div>');
}
function delFeedback(i){
  if(!confirm('确定删除这条留言吗？')) return;
  const list = getFeedbacks();
  list.splice(i, 1);
  localStorage.setItem('sxx_feedback', JSON.stringify(list));
  renderFeedbacks();
}

/* ============ 系统消息（铃铛 · 云端同步 + 已读永久保存） ============ */
const NOTICE_READ_KEY = 'sxx_notice_read_ts';
const WELCOME_NOTICE = { id:'welcome', title:'欢迎使用三下乡 · 文化云游', content:'这里是系统消息栏，管理员发布的重要通知会第一时间推送到这里。', ts:0 };
let _notices = [];           // 当前消息列表（ts 降序）
let _noticePopOpen = false;

function saveMetaToDB(key, value){
  return new Promise((resolve, reject) => {
    const tx = db.transaction('metadata','readwrite');
    tx.objectStore('metadata').put({ key, value });
    tx.onsuccess = () => resolve(true);
    tx.onerror = (e) => reject(e.target.error);
  });
}
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function noticeReadTs(){ return parseInt(localStorage.getItem(NOTICE_READ_KEY) || '0') || 0; }
function ghCfg(){ try{ return JSON.parse(localStorage.getItem('sxx_github_config') || 'null'); }catch(e){ return null; } }

// 拉取云端元数据：通道1 GitHub Pages（免限流），通道2 API raw 兜底
async function fetchCloudMeta(){
  const cfg = ghCfg();
  if(!cfg || !cfg.repo) return null;
  try{
    const slash = cfg.repo.indexOf('/');
    const owner = cfg.repo.slice(0, slash), repo = cfg.repo.slice(slash + 1);
    const r = await fetch('https://' + owner + '.github.io/' + repo + '/sxx_metadata.json?buster=' + Date.now(), { cache:'no-store' });
    if(r.ok){
      const j = await r.json();
      if(j && typeof j === 'object' && !Array.isArray(j)) return j;
    }
  }catch(e){}
  try{
    const h = { 'Accept':'application/vnd.github.raw' };
    if(cfg.token) h['Authorization'] = 'token ' + cfg.token;
    const r2 = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json?raw=' + Date.now(), { headers:h, cache:'no-store' });
    if(r2.ok){
      const j = JSON.parse(await r2.text());
      if(j && typeof j === 'object' && !Array.isArray(j)) return j;
    }
  }catch(e){}
  return null;
}

// 管理员：推送消息后的元数据上传（先拉云端最新为底，只改 systemNotices，防覆盖其他字段）
async function pushNoticesToCloud(noticeList){
  const cfg = ghCfg();
  if(!cfg || !cfg.token){ throw new Error('未配置 GitHub Token，消息仅保存在本机'); }
  const cloud = await fetchCloudMeta().catch(() => null) || {};
  cloud.systemNotices = noticeList;
  cloud.timestamp = Date.now();
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(cloud))));
  const H = { 'Authorization':'token ' + cfg.token, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' };
  const doPut = async (sha) => {
    const body = { message:'sync system notices', content:b64 };
    if(sha) body.sha = sha;
    const r = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { method:'PUT', headers:H, body:JSON.stringify(body) });
    if(!r.ok && (r.status === 409 || r.status === 422)){
      // sha 过期/并发冲突：重取 sha 重试一次
      const g = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { headers:H });
      if(g.ok){
        const j = await g.json();
        const body2 = { message:'sync system notices retry', content:b64, sha:j.sha };
        const r2 = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { method:'PUT', headers:H, body:JSON.stringify(body2) });
        if(!r2.ok) throw new Error('上传失败 ' + r2.status);
        return;
      }
    }
    if(!r.ok) throw new Error('上传失败 ' + r.status);
  };
  let sha = null;
  try{
    const g = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { headers:{ 'Authorization':'token ' + cfg.token, 'Accept':'application/vnd.github.v3+json' } });
    if(g.ok) sha = (await g.json()).sha;
  }catch(e){}
  await doPut(sha);
}

// 加载消息：本地 IndexedDB → 叠加云端（云端有新消息时合并），并刷新红点
async function refreshNotices(){
  let list = [];
  try{
    const meta = (await getMetaFromDB('allMetadata')) || {};
    if(Array.isArray(meta.systemNotices)) list = meta.systemNotices.slice();
  }catch(e){}
  let cloudChanged = false;
  try{
    const cloud = await fetchCloudMeta();
    if(cloud && Array.isArray(cloud.systemNotices)){
      const map = {};
      list.forEach(n => { if(n && n.id) map[n.id] = n; });
      cloud.systemNotices.forEach(n => {
        if(n && n.id && (!map[n.id] || (n.ts || 0) > (map[n.id].ts || 0))){ map[n.id] = n; cloudChanged = true; }
      });
      list = Object.values(map);
    }
  }catch(e){}
  list.sort((a,b) => (b.ts || 0) - (a.ts || 0));
  _notices = list.slice(0, 30);
  // 从未有消息时展示欢迎消息（ts=0，不会触发红点）
  if(!_notices.length) _notices = [WELCOME_NOTICE];
  if(cloudChanged){
    try{
      const meta = (await getMetaFromDB('allMetadata')) || {};
      meta.systemNotices = _notices;
      await saveMetaToDB('allMetadata', meta);
    }catch(e){}
  }
  updateBellDot();
}
function updateBellDot(){
  const hasUnread = _notices.some(n => (n.ts || 0) > noticeReadTs());
  document.getElementById('bellDot').classList.toggle('show', hasUnread);
  if(hasUnread){
    const btn = document.getElementById('bellBtn');
    btn.classList.remove('ringing'); void btn.offsetWidth; btn.classList.add('ringing');
  }
}
function renderNoticeList(){
  const box = document.getElementById('noticeList');
  if(!_notices.length){
    box.innerHTML = '<div class="np-empty">📭 暂无系统消息</div>';
    return;
  }
  box.innerHTML = _notices.map(n => `
    <div class="np-item">
      <div class="np-t">${escapeHtml(n.title || '系统消息')}</div>
      <div class="np-c">${escapeHtml(n.content || '')}</div>
      ${n.ts ? `<div class="np-time">🕐 ${new Date(n.ts).toLocaleString('zh-CN')}</div>` : ''}
      ${isAdmin ? `<button class="np-del" onclick="deleteNotice('${escapeHtml(n.id)}')" title="删除该消息">🗑️</button>` : ''}
    </div>
  `).join('');
}
// 查看消息：面板打开即标记全部已读（永久保存，刷新不复发红点）
function toggleNoticePop(e){
  if(e) e.stopPropagation();
  _noticePopOpen = !_noticePopOpen;
  const pop = document.getElementById('noticePop');
  if(!_noticePopOpen){ pop.classList.remove('show'); return; }
  pop.classList.add('show');
  renderNoticeList();
  const maxTs = _notices.reduce((m, n) => Math.max(m, n.ts || 0), 0);
  if(maxTs > noticeReadTs()){
    try{ localStorage.setItem(NOTICE_READ_KEY, String(maxTs)); }catch(err){}
  }
  updateBellDot();
  // 打开时后台再拉一次云端，及时接收新消息
  refreshNotices().then(() => { if(_noticePopOpen) renderNoticeList(); });
}
function closeNoticePop(){
  _noticePopOpen = false;
  document.getElementById('noticePop').classList.remove('show');
}
// 点击页面其他区域关闭面板
document.addEventListener('click', (e) => {
  if(!_noticePopOpen) return;
  const pop = document.getElementById('noticePop');
  if(pop && !pop.contains(e.target)) closeNoticePop();
});
// 管理员：发布系统消息（云端推送，所有设备可见）
async function publishNotice(){
  if(!isAdmin) return;
  const title = document.getElementById('noticeTitle').value.trim();
  const content = document.getElementById('noticeText').value.trim();
  if(!title || !content){ alert('请填写消息标题和内容'); return; }
  const btn = document.querySelector('.notice-admin button');
  btn.disabled = true; btn.textContent = '⏳ 正在发布…';
  try{
    // 以云端最新列表为底追加，防多设备发布互相覆盖
    const cloud = await fetchCloudMeta().catch(() => null);
    let list = Array.isArray(cloud && cloud.systemNotices) ? cloud.systemNotices.slice() : _notices.slice();
    list.unshift({ id:'n' + Date.now(), title, content, ts:Date.now() });
    list.sort((a,b) => (b.ts || 0) - (a.ts || 0));
    list = list.slice(0, 30);
    await pushNoticesToCloud(list);
    // 本地落库 + 立即生效
    _notices = list;
    try{
      const meta = (await getMetaFromDB('allMetadata')) || {};
      meta.systemNotices = list;
      await saveMetaToDB('allMetadata', meta);
    }catch(e){}
    document.getElementById('noticeTitle').value = '';
    document.getElementById('noticeText').value = '';
    updateBellDot();
    if(_noticePopOpen) renderNoticeList();
    alert('✅ 系统消息已发布并同步云端，所有设备均可收到');
  }catch(err){
    alert('❌ 发布失败：' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = '☁️ 发布并同步云端';
  }
}
// 管理员：删除系统消息
async function deleteNotice(id){
  if(!isAdmin) return;
  if(!confirm('确定删除这条系统消息吗？所有设备都将不再显示。')) return;
  try{
    const cloud = await fetchCloudMeta().catch(() => null);
    let list = Array.isArray(cloud && cloud.systemNotices) ? cloud.systemNotices.slice() : _notices.slice();
    list = list.filter(n => n.id !== id);
    await pushNoticesToCloud(list);
    _notices = list.slice(0, 30);
    try{
      const meta = (await getMetaFromDB('allMetadata')) || {};
      meta.systemNotices = _notices;
      await saveMetaToDB('allMetadata', meta);
    }catch(e){}
    updateBellDot();
    renderNoticeList();
  }catch(err){
    alert('❌ 删除失败：' + err.message);
  }
}

/* ============ 数据统计 ============ */
async function loadStats(){
  try{
    const meta = (await getMetaFromDB('allMetadata')) || {};
    const buildings = (meta.buildingIds && meta.buildingIds.length) ? meta.buildingIds.length : 6;
    const red = (Array.isArray(meta.redSpots) && meta.redSpots.length) ? meta.redSpots.length : 4;
    const products = (Array.isArray(meta.products) && meta.products.length) ? meta.products.length : 6;
    const customs = (Array.isArray(meta.customs) && meta.customs.length) ? meta.customs.length : 6;
    animateNum('stBuildings', buildings);
    animateNum('stRed', red);
    animateNum('stProducts', products);
    animateNum('stCustoms', customs);
  }catch(e){
    ['stBuildings','stRed','stProducts','stCustoms'].forEach(id => document.getElementById(id).textContent = '0');
  }
}
function animateNum(id, target){
  const el = document.getElementById(id);
  let cur = 0;
  const step = Math.max(1, Math.ceil(target / 20));
  const timer = setInterval(() => {
    cur += step;
    if(cur >= target){ cur = target; clearInterval(timer); }
    el.textContent = cur;
  }, 40);
}

/* ============ 管理员可编辑文字（meText 存元数据，云端同步） ============ */
// 应用已保存的文字（覆盖默认值）
function applyMeText(mt){
  if(!mt) return;
  document.querySelectorAll('[data-mekey]').forEach(el => {
    const v = mt[el.dataset.mekey];
    if(typeof v === 'string' && v) el.textContent = v;
  });
}
// 管理员态开放编辑；失焦保存（本地 IndexedDB + 云端 meText 字段）
function bindMeEditable(){
  document.querySelectorAll('[data-mekey]').forEach(el => {
    if(!isAdmin){ el.removeAttribute('contenteditable'); el.onblur = null; return; }
    el.setAttribute('contenteditable','true');
    el.setAttribute('spellcheck','false');
    // 管理员点文字 = 进入编辑：拦截冒泡与默认导航（菜单行是 <a>，点文字不再触发跳转/logout/clearCart）；
    // 点行内图标或右侧箭头仍正常执行功能
    if(!el.__meClickBound){
      el.__meClickBound = true;
      el.addEventListener('click', e => {
        e.stopPropagation();
        e.preventDefault();
        el.focus();
      });
    }
    el.onblur = async () => {
      const key = el.dataset.mekey;
      const val = el.textContent.trim();
      let mt = {};
      try{ mt = ((await getMetaFromDB('allMetadata')) || {}).meText || {}; }catch(e){}
      if(mt[key] === val) return;
      mt[key] = val;
      try{
        const meta = (await getMetaFromDB('allMetadata')) || {};
        meta.meText = mt;
        await saveMetaToDB('allMetadata', meta);
      }catch(e){}
      pushMeTextToCloud(mt).catch(() => {});
    };
  });
}
// 管理员：推送 meText（以云端最新为底只改 meText 字段，防覆盖其他字段；409/422 重取重试）
async function pushMeTextToCloud(meText){
  const cfg = ghCfg();
  if(!cfg || !cfg.token) return; // 无 Token 仅保存在本机
  const H = { 'Authorization':'token ' + cfg.token, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' };
  const put = async (body) => {
    const r = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { method:'PUT', headers:H, body:JSON.stringify(body) });
    if(!r.ok) throw new Error('上传失败 ' + r.status);
  };
  const buildBody = (cloud, sha) => {
    cloud.meText = meText;
    cloud.timestamp = Date.now();
    const body = { message:'sync me text', content:btoa(unescape(encodeURIComponent(JSON.stringify(cloud)))) };
    if(sha) body.sha = sha;
    return body;
  };
  let sha = null;
  try{
    const g = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { headers:{ 'Authorization':'token ' + cfg.token, 'Accept':'application/vnd.github.v3+json' } });
    if(g.ok) sha = (await g.json()).sha;
  }catch(e){}
  const first = await fetchCloudMeta().catch(() => null) || {};
  try{
    await put(buildBody(first, sha));
  }catch(e){
    // 并发冲突：重取云端为底重试一次
    const g2 = await fetch('https://api.github.com/repos/' + cfg.repo + '/contents/sxx_metadata.json', { headers:H });
    if(!g2.ok) throw e;
    await put(buildBody(await fetchCloudMeta().catch(() => null) || {}, (await g2.json()).sha));
  }
}

/* ============ 初始化 ============ */
(async function init(){
  checkAdmin();
  updateCartInfo();
  renderFeedbacks();
  await openDB();
  loadStats();
  // 可编辑文字：先应用本机已保存的，再拉云端覆盖（管理员开放编辑）
  try{ applyMeText(((await getMetaFromDB('allMetadata')) || {}).meText); }catch(e){}
  bindMeEditable();
  fetchCloudMeta().then(cloud => { if(cloud && cloud.meText) applyMeText(cloud.meText); }).catch(() => {});
  // 系统消息：本地秒显 → 云端增量拉取（游客也能收）
  await refreshNotices();
  if(_noticePopOpen) renderNoticeList();
})();
</script>
