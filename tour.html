<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:#F5E6D3;
    background-image:radial-gradient(circle at 20% 20%, rgba(139,26,26,.04) 0%, transparent 50%),radial-gradient(circle at 80% 80%, rgba(139,26,26,.04) 0%, transparent 50%);

  /* ============ 顶栏 ============ */

    background:#8B1A1A;color:#fff;
    padding:10px 18px;display:flex;align-items:center;justify-content:space-between;

  .top-nav .logo{

    display:flex;align-items:center;gap:8px;
  }
  .back-home{

    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);
    padding:6px 14px;border-radius:20px;transition:.25s;letter-spacing:1px;
  }

  /* ============ 页头 Banner ============ */
  .page-banner{

    background:linear-gradient(135deg,#8B1A1A 0%,#A63426 55%,#8B1A1A 100%);

  }
  .page-banner::after{

  .page-banner h1{font-size:28px;letter-spacing:6px;margin-bottom:10px;color:#FDE68A}
  .page-banner p{font-size:13.5px;letter-spacing:2px;opacity:.92}

  /* ============ 内容区 ============ */
  .page-main{max-width:1180px;margin:0 auto;padding:20px 16px 50px}
  .page-title{

  }
  .page-title::before,.page-title::after{content:"";display:inline-block;width:36px;height:2px;background:#C9A24A}
  .page-subtitle{text-align:center;font-size:12.5px;color:#a0764f;letter-spacing:2px;margin-bottom:24px}

  /* ============ 4 大栏目分类（红韵·生态·数智·文明） ============ */

  .category-tab{

  .category-tab.cat-eco.active{background:#1f6b3b;color:#e3f5de;border-color:#1f6b3b}
  .category-tab.cat-int.active{background:#1d4e89;color:#e0ecff;border-color:#1d4e89}
  .category-tab.cat-civ.active{background:#8b6a1a;color:#fff7d7;border-color:#8b6a1a}

  .tour-section{margin:34px 0 10px}

  .modal-box h3{color:#8B1A1A;font-size:21px;letter-spacing:2px;margin-bottom:14px;outline:none}
  .modal-box .mb-desc{font-size:14.5px;line-height:2;color:#5a3a3a;white-space:pre-wrap;outline:none}
  .mb-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}

  /* ============ 底部 Tab Bar ============ */

    position:fixed;left:0;right:0;bottom:0;z-index:150;height:56px;
    background:#fff;border-top:2px solid #C9A24A;

</style>

<script>
/* ============ 数据层（与 index.html 同源共享 IndexedDB） ============ */
const DB_NAME = 'sxx_database', DB_VERSION = 2;
let db = null, isAdmin = false;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('images')) d.createObjectStore('images', { keyPath:'key' });
      if(!d.objectStoreNames.contains('metadata')) d.createObjectStore('metadata', { keyPath:'key' });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}
function getMetaFromDB(key){
  return new Promise((resolve, reject) => {
    const tx = db.transaction('metadata','readonly'), rq = tx.objectStore('metadata').get(key);
    rq.onsuccess = () => resolve(rq.result ? rq.result.value : null);
    rq.onerror = (e) => reject(e.target.error);
  });
}
function saveMetaToDB(key, value){
  return new Promise((resolve, reject) => {
    const tx = db.transaction('metadata','readwrite');
    tx.objectStore('metadata').put({ key, value, timestamp: Date.now() });
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}
function getImageFromDB(key){
  return new Promise((resolve, reject) => {
    const tx = db.transaction('images','readonly'), rq = tx.objectStore('images').get(key);
    rq.onsuccess = () => resolve(rq.result ? (rq.result.data || null) : null);
    rq.onerror = (e) => reject(e.target.error);
  });
}
function saveImageToDB(key, dataUrl){
  return new Promise((resolve, reject) => {
    const tx = db.transaction('images','readwrite');
    tx.objectStore('images').put({ key, data: dataUrl, timestamp: Date.now() });
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}
/* 读全量 metadata → 修改一个字段 → 写回（保证不覆盖首页数据） */
async function saveAllMeta(mutator){
  const meta = (await getMetaFromDB('allMetadata')) || {};
  mutator(meta);
  await saveMetaToDB('allMetadata', meta);
  // 云同步推送：管理员且已配置 Token 时自动推云端（先传媒体，再传清单），让其他设备/页面立即看到
  scheduleCloudPush(meta);
}

/* ============ 4 栏目分类 ============ */
const CATEGORY_LIST = [
  { key: 'red', label: '红韵马踏', cls: 'cat-red' },
  { key: 'eco', label: '生态马踏', cls: 'cat-eco' },
  { key: 'int', label: '数智马踏', cls: 'cat-int' },
  { key: 'civ', label: '文明马踏', cls: 'cat-civ' }
];
// 对历史 9 个建筑给默认分类（未在 buildingCats 中的新建筑默认归到「红韵马踏」）。
// 依据用户要求：杨梅园→生态；香蜜早荔枝园（电商销售）→数智；其余按红色/生态/文明归属分配。
const CATEGORY_DEFAULTS = {
  '1': 'red',   // 杨瑞芬故居
  '2': 'red',   // 马踏革命烈士纪念碑
  '3': 'red',   // 黄东祠堂
  '4': 'red',   // 党建广场
  '5': 'eco',   // 坡连洞（坡连垌）生态园
  '6': 'eco',   // 万亩良田
  'b1788427073369': 'eco', // 杨梅园 （用户要求移出红韵→生态）
  'b1788427187877': 'int', // 香蜜早荔枝园（电商销售；用户要求放入数智）
  'b1788427335673': 'civ'  // 风车山（风力发电；绿色能源→文明）
};
function getCat(meta, bid){
  meta.buildingCats = meta.buildingCats || {};
  if(meta.buildingCats[bid]) return meta.buildingCats[bid];
  if(CATEGORY_DEFAULTS[bid]){ meta.buildingCats[bid] = CATEGORY_DEFAULTS[bid]; return CATEGORY_DEFAULTS[bid]; }
  meta.buildingCats[bid] = 'red'; return 'red';
}
function scrollToSection(id){
  const el = document.getElementById(id);
  if(el){ el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  // 高亮对应 tab

/* ============ 简易云同步推送（媒体 + 元数据统一排队） ============ */
// 与 index.html 对齐：先传媒体文件，再传元数据清单，失败重试，进度提示
const TOUR_GH_CFG_KEY = 'sxx_github_config';
function tourGhConfig(){ try{ return JSON.parse(localStorage.getItem(TOUR_GH_CFG_KEY) || 'null'); }catch(e){ return null; } }
let _tourCloudTimer = null;
const _tourPendingMedia = new Set();
function scheduleCloudPush(meta){
  const cfg = tourGhConfig();
  if(!(cfg && cfg.token && cfg.repo)) return;
  clearTimeout(_tourCloudTimer);
  _tourCloudTimer = setTimeout(async () => await flushTourPending(meta), 900);
}
function queueTourMedia(key){ const cfg = tourGhConfig(); if(cfg && cfg.token && cfg.repo){ _tourPendingMedia.add(key); scheduleCloudPush({}); } }
async function flushTourPending(meta){
  const cfg = tourGhConfig();
  if(!(cfg && cfg.token && cfg.repo)) return;
  // 1) 上传待传媒体（并发 3，单文件 <25MB）
  const keys = Array.from(_tourPendingMedia);
  _tourPendingMedia.clear();
  if(keys.length){
    let done = 0;
    showTourToast('☁️ 同步图片 ' + done + '/' + keys.length + ' …请勿关闭页面');
    const worker = async () => {
      while(keys.length){
        const k = keys.shift();
        try{
          const rec = await (new Promise((resolve, reject) => {
            const tx = db.transaction('images','readonly');
            const rq = tx.objectStore('images').get(k);
            rq.onsuccess = () => resolve(rq.result || null);
            rq.onerror = () => reject(rq.error);
          }));
          if(rec){
            if((rec.data instanceof Blob) && rec.data.size > 25 * 1024 * 1024){ throw new Error('超25MB'); }
            await ghPutFileForTour('media/' + encodeURIComponent(k) + ((rec.data instanceof Blob) ? '.glb' : '.img'),
              ((rec.data instanceof Blob) ? (async () => {
                const buf = new Uint8Array(await rec.data.arrayBuffer());
                let bin = ''; const CH = 0x8000;
                for(let i = 0; i < buf.length; i += CH){ bin += String.fromCharCode.apply(null, buf.subarray(i, i + CH)); }
                return btoa(bin);
              })() : Promise.resolve(btoa(rec.data))),
              'sync tour media ' + k);
            markTourUploaded(k, rec.timestamp || 0);
          }
        }catch(e){ console.warn('媒体上传失败:', k, e.message); }
        done++;
        showTourToast('☁️ 同步图片 ' + done + '/' + keys.length + ' …请勿关闭页面');
      }
    };
    await Promise.all(Array.from({ length: Math.min(3, keys.length) }, () => worker()));
    hideTourToast();
  }
  // 2) 再传元数据清单（与 index.html 共用同一文件，不覆盖彼此其他字段）
  try{
    const finalMeta = (await getMetaFromDB('allMetadata')) || {};
    // 补充 mediaFiles 清单（让 index/panorama 其他页面能看到这里的图）
    try{
      const recs = await (new Promise((resolve, reject) => {
        const tx = db.transaction('images','readonly');
        const rq = tx.objectStore('images').getAll();
        rq.onsuccess = () => resolve(rq.result || []);
        rq.onerror = () => reject(rq.error);
      }));
      finalMeta.mediaFiles = finalMeta.mediaFiles || {};
      recs.forEach(r => { finalMeta.mediaFiles[r.key] = (r.data instanceof Blob) ? 'glb' : 'img'; });
    }catch(e){}
    finalMeta.timestamp = Date.now();
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(finalMeta))));
    let sha = null;
    try{
      const r = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/sxx_metadata.json`, {
        headers: { 'Authorization': 'token ' + cfg.token, 'Accept': 'application/vnd.github.v3+json' }
      });
      if(r.ok){ const j = await r.json(); sha = j.sha; }
    }catch(e){}
    const body = { message: 'sync tour metadata', content: b64 };
    if(sha) body.sha = sha;
    await fetch(`https://api.github.com/repos/${cfg.repo}/contents/sxx_metadata.json`, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + cfg.token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    console.log('☁️ tour.html 云端同步完成');
  }catch(e){ console.warn('tour 元数据同步失败:', e.message); }
}
function ghPutFileForTour(path, contentOrPromise, msg){
  return Promise.resolve(contentOrPromise).then(content => {
    const cfg = tourGhConfig();
    if(!cfg || !cfg.token) return Promise.resolve();
    const url = `https://api.github.com/repos/${cfg.repo}/contents/${path}`;
    const h = { 'Authorization': 'token ' + cfg.token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
    return fetch(url, { headers: h, method: 'GET' }).then(r => r.ok ? r.json() : null).then(ex => {
      const body = { message: msg || 'sync', content };
      if(ex && ex.sha) body.sha = ex.sha;
      return fetch(url, { method: 'PUT', headers: h, body: JSON.stringify(body) });
    }).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)));
  });
}
function markTourUploaded(key, ts){
  try{
    const m = JSON.parse(localStorage.getItem('sxx_uploaded_media') || '{}');
    m[key] = ts;

  }catch(e){}
}

/* 给定 <owner>/<repo>，返回 GitHub Pages 基础 URL。
 * 兼容：(a) Pages site 自定义域名发布时（若 metadata 返回的 pagesBase 优先会用它，无则按默认拼）；
 * (b) repo 路径被误配置时的健壮处理。
 */
function pagesBaseForRepo(repo){
  const m = (repo || '').match(/^([^/]+)\/([^/]+)$/);
  if(!m) return null;
  return 'https://' + m[1] + '.github.io/' + m[2];
}

/* ============ 下载端：多级通道（Pages→API raw）增量拉缺失的建筑图，自动双平台互通 ============ */
// （仅在 IndexedDB 本地没有图的才拉，不覆盖本地新编辑）
async function cloudPullBuildingsImages(){
  // 用 Pages 直读元数据（免限流），失败再回退 API raw
  const repo = (tourGhConfig() && tourGhConfig().repo) || 'miao051028/myweb';
  const base = pagesBaseForRepo(repo);
  let meta = null;
  const urls = [
    base + '/sxx_metadata.json',
    'https://api.github.com/repos/' + repo + '/contents/sxx_metadata.json?raw=' + Date.now()
  ];
  for(const u of urls){
    try{
      const headers = { 'Cache-Control': 'no-cache' };
      if(u.indexOf('api.github.com') !== -1){
        headers['Accept'] = 'application/vnd.github.raw';
        const cfg = tourGhConfig(); if(cfg && cfg.token) headers['Authorization'] = 'token ' + cfg.token;
      }
      const r = await fetch(u, { headers });
      if(r.ok){ meta = JSON.parse(await r.text()); break; }
    }catch(e){}
  }
  if(!meta) return;
  // 合并元数据到本地（本地值优先，避免覆盖本机编辑），同时补全 buildingCats 默认值
  const merged = mergeMetaSafe(meta, (await getMetaFromDB('allMetadata')) || {});
  await saveMetaToDB('allMetadata', merged);
  // 管理员：远端拉来的合并结果中 buildingCats/建筑名 等字段变动，顺手推回远端（防止远端用户在旧 tour.html 下缺分类）
  if(isAdmin && tourGhConfig() && tourGhConfig().token){ scheduleCloudPush(merged); }
  // 增量拉取缺失的建筑图 / 3D 全景媒体
  const mf = merged.mediaFiles || {};
  const keys = Object.keys(mf).filter(k => /^(building_|pano_(image|img_|model))/.test(k));
  let pulled = 0;
  for(const key of keys){
    try{
      const exist = await (new Promise(resolve => {
        const tx = db.transaction('images','readonly');
        const rq = tx.objectStore('images').get(key);
        rq.onsuccess = () => resolve(!!rq.result);
        rq.onerror = () => resolve(false);
      }));
      if(exist) continue;
      const data = await downloadTourMediaRaw(key, mf[key]);
      if(data){
        await saveImageToDB(key, data);
        pulled++;
      }
    }catch(e){}
  }
  if(pulled > 0) showTourToast('☁️ 已同步 ' + pulled + ' 张图片/3D 内容');
  return pulled;
}
function mergeMetaSafe(remote, local){
  const out = Object.assign({}, remote, local);
  out.buildingInfos = Object.assign({}, remote.buildingInfos || {}, local.buildingInfos || {});
  out.buildingCats = Object.assign({}, remote.buildingCats || {}, local.buildingCats || {}, CATEGORY_DEFAULTS); // 保证所有历史建筑有默认分类
  out.buildingIds = (local.buildingIds && local.buildingIds.length) ? local.buildingIds : (remote.buildingIds || []);
  out.panoBuildings = Object.assign({}, remote.panoBuildings || {}, local.panoBuildings || {});
  out.panoNames = Object.assign({}, remote.panoNames || {}, local.panoNames || {});
  out.mediaFiles = Object.assign({}, remote.mediaFiles || {}, local.mediaFiles || {});
  out.timestamp = Math.max(remote.timestamp || 0, local.timestamp || 0);
  return out;
}
async function downloadTourMediaRaw(key, type){
  const repo = (tourGhConfig() && tourGhConfig().repo) || 'miao051028/myweb';
  const base = pagesBaseForRepo(repo);
  const ext = type === 'glb' ? '.glb' : '.img';
  const path = 'media/' + encodeURIComponent(key) + ext;
  // 1) Pages
  if(base){
    try{
      const r = await fetch(base + '/' + path, { cache: 'no-cache' });
      if(r.ok) return type === 'glb' ? new Blob([new Uint8Array(await r.arrayBuffer())], { type: 'model/gltf-binary' }) : await r.text();
    }catch(e){}
  }
  // 2) API raw 兜底
  try{
    const h = { 'Accept': 'application/vnd.github.raw', 'Cache-Control': 'no-cache' };
    const cfg = tourGhConfig(); if(cfg && cfg.token) h['Authorization'] = 'token ' + cfg.token;
    const r2 = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?raw=${Date.now()}`, { headers: h });
    if(r2.status === 404) return null;
    if(!r2.ok) throw new Error('HTTP ' + r2.status);
    return type === 'glb' ? new Blob([new Uint8Array(await r2.arrayBuffer())], { type: 'model/gltf-binary' }) : await r2.text();
  }catch(e){ return null; }
}

// 压缩上传图，保证新上传图 <1MB，避免 GitHub JSON 通道 >1MB 空 content 问题
async function compressImage(dataUrl, maxWidth, quality, fallbackStep){
  return new Promise((resolve) => {
    const im = new Image();
    im.onload = () => {
      let w = im.width, h = im.height;
      if(w > maxWidth || h > maxWidth){
        if(w > h){ h = Math.round(h * maxWidth / w); w = maxWidth; }
        else { w = Math.round(w * maxWidth / h); h = maxWidth; }
      }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(im, 0, 0, w, h);
      let out = cv.toDataURL('image/jpeg', quality);
      // 兜底：仍大于 900KB（dataURL 约 120 万字符）则逐档缩小
      const steps = fallbackStep && fallbackStep.length ? fallbackStep : [];
      let i = 0;
      while(out.length > 1200000 && i < steps.length){
        const [mw, q] = steps[i++];
        const c2 = document.createElement('canvas');
        let w2 = im.width, h2 = im.height;
        if(w2 > mw || h2 > mw){ if(w2 > h2){ h2 = Math.round(h2 * mw / w2); w2 = mw; } else { w2 = Math.round(w2 * mw / h2); h2 = mw; } }
        c2.width = w2; c2.height = h2;
        c2.getContext('2d').drawImage(im, 0, 0, w2, h2);
        out = c2.toDataURL('image/jpeg', q);
      }
      resolve(out);
    };
    im.onerror = () => resolve(dataUrl);
    im.src = dataUrl;
  });
}

    ['mbName','mbDesc'].forEach(mid => {
      const el = document.getElementById(mid);
      el.onblur = async () => {
        const val = el.textContent.trim();
        const field = mid === 'mbName' ? 'name' : 'intro';
        const item = buildings.find(x => x.id === currentId);
        if(!item || item[field] === val) return;
        item[field] = val;
        await saveAllMeta(m => {
          m.buildingInfos = m.buildingInfos || {};
          m.buildingInfos[field === 'name' ? currentId + '_name' : currentId] = val;
        });
        renderGrid();
      };
    });
  } else {
    ['mbName','mbDesc'].forEach(mid => {
      const el = document.getElementById(mid);
      el.removeAttribute('contenteditable');
      el.onblur = null;
    });
    document.getElementById('mbActions').style.display = 'none';
  }
  document.getElementById('detailModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeDetail(){
  document.getElementById('detailModal').classList.remove('active');
  document.body.style.overflow = '';
  renderGrid();
}
function editFromDetail(){ /* 内容已可就地编辑，此按钮提示 */
  document.getElementById('mbDesc').focus();
}

/* 换图 */
let pickTarget = null;
function replaceCardImage(id){ pickTarget = { mode:'card', id }; document.getElementById('filePicker').click(); }
function pickDetailImage(){ pickTarget = { mode:'card', id: currentId }; document.getElementById('filePicker').click(); }
document.getElementById('filePicker').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file || !pickTarget) return;
  const reader = new FileReader();
  reader.onload = async () => {
    // 压缩（与 index.html 对齐：新上传图保证 <1MB，避免跨端 >1MB 空 content）
    const compressed = await compressImage(reader.result, 1600, 0.82, [[1400, 0.7], [1200, 0.6], [1000, 0.5]]);
    await saveImageToDB('building_' + pickTarget.id, compressed);
    const item = buildings.find(x => x.id === pickTarget.id);
    if(item) item.img = compressed;
    // 把换图立即放入云同步队列（先传文件再传清单）
    queueTourMedia('building_' + pickTarget.id);
    await saveAllMeta(m => {
      m.buildingKeys = m.buildingKeys || [];
      if(!m.buildingKeys.includes(pickTarget.id)) m.buildingKeys.push(pickTarget.id);
    });
    renderGrid();
    if(document.getElementById('detailModal').classList.contains('active') && currentId === pickTarget.id){
      document.getElementById('mbImg').innerHTML = `<img src="${compressed}" alt="">`;
    }
    alert('✅ 图片已自动压缩保存并同步到云端！（另一台设备打开页面会自动下载）');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

/* 添加 / 删除建筑 */
async function addBuilding(){
  const newId = 'b' + Date.now();
  const newName = '新建筑';
  const defaultIntro = '在此处填写建筑的历史背景、文化价值、建筑特色等介绍内容……';
  const catSel = document.getElementById('newBuildingCat');
  const defaultCat = (catSel && catSel.value) || 'red';
  buildings.push({ id:newId, name:newName, intro:defaultIntro, img:null, cat:defaultCat });
  await saveAllMeta(m => {
    m.buildingIds = m.buildingIds || [];
    m.buildingIds.push(newId);
    m.buildingInfos = m.buildingInfos || {};
    m.buildingInfos[newId + '_name'] = newName;
    m.buildingInfos[newId] = defaultIntro;
    m.buildingCats = m.buildingCats || {};
    m.buildingCats[newId] = defaultCat;
  });
  renderGrid();
  openDetail(newId);
}
async function deleteBuilding(id){
  if(!confirm('确定删除该建筑吗？')) return;
  buildings = buildings.filter(b => b.id !== id);
  await saveAllMeta(m => {
    m.buildingIds = (m.buildingIds || []).filter(x => x !== id);
    if(m.buildingInfos){ delete m.buildingInfos[id]; delete m.buildingInfos[id + '_name']; }
    if(m.buildingCats){ delete m.buildingCats[id]; }
    if(m.panoBuildings){ delete m.panoBuildings[id]; }
    if(m.panoNames){ delete m.panoNames[id]; }
    if(m.mediaFiles){ delete m.mediaFiles['building_' + id]; delete m.mediaFiles['pano_img_' + id]; delete m.mediaFiles['pano_model_' + id]; }
  });
  renderGrid();
}

/* ============ 初始化 ============ */
let currentId = null;
(async function init(){
  checkAdmin();
  try{
    await openDB();
    // ① 读本地（不覆盖已有）
    await loadBuildings();
    renderGrid();
    // ② 云端增量拉：自动把另一台设备上传的图片/3D全景同步到本机（游客也能拉）
    try{ await cloudPullBuildingsImages(); }catch(e){ console.warn('云端拉取失败', e.message); }
    // ③ 拉完新图重新渲染
    await loadBuildings();
    renderGrid();
  }catch(e){
    console.warn('tour init err', e);
    CATEGORY_LIST.forEach(c => {
      const g = document.querySelector(`.card-grid[data-grid="${c.key}"]`);
      if(g) g.innerHTML = '<div style="text-align:center;color:#a0764f;padding:40px 0">数据加载失败，请刷新重试</div>';
    });
  }
})();
</script>
